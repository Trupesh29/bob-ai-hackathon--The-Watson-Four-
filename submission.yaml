ibm_bob_usage: >
  IBM Bob is the primary development IDE throughout the project.  Relevant task
  histories and task-consumption screenshots are exported to bob_sessions/.
  A PortFlow MCP server exposes structured, safe, read-only tools so Bob can
  explain congestion risk and plan summaries in natural language.  Bob does not
  calculate berth or crane assignments, fabricate predictions, or approve
  operations plans.

