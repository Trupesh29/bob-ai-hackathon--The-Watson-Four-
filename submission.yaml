live_demo_url: NOT DEPLOYED
key_features: &id001
- CSV and manual vessel schedule input with berth/crane availability controls
- 72-hour congestion forecast and vessel waiting-time estimates using baseline rules
  or trained ML
- CP-SAT berth-and-crane optimization with FIFO waiting-time comparison
- Advisory alternate routing, berth visualization, and explicit prototype plan approval
- Local operational Copilot with optional Watsonx provider and separate read-only
  MCP tools
tech_stack:
  frontend: React 18, Vite 6, TypeScript, Tailwind CSS 3, React Router 7, Recharts
    3, SVG berth visualization
  backend: Python 3.12, FastAPI, Pydantic v2, SQLAlchemy 2, Alembic, PostgreSQL
  ml: NumPy, Pandas, scikit-learn Random Forest models, Joblib
  optimisation: Google OR-Tools CP-SAT
  ai_tool: IBM Bob (IDE + MCP read-only server for explanations)
ibm_bob_usage: Team-reported IBM Bob development usage; genuine session exports are
  pending. The TypeScript MCP server exposes risk, waiting-time, and plan-summary
  tools without database writes. Optional Watsonx deployment configuration is supported
  by Copilot; live IBM provider execution has not been verified in this review.
known_limitations:
- Synthetic training/demo data; no validated real-port forecasting accuracy or live
  AIS feed
- Single-terminal scope; alternate routing is advisory
- Plan approval is ephemeral and does not persist or activate an operational schedule
- No public deployment; video access permissions have not been independently verified
- Three genuine running-app screenshots and Bob session exports remain pending
- Clean backend/ML/end-to-end QA remains incomplete; existing lint findings remain
