project_name: PortFlow AI - Container Congestion Predictor & Port Operations Optimiser
track: AI
problem_statement: 'L1 — Container Congestion Predictor & Port Operations Optimiser.
  Port shift supervisors lack the tools to anticipate berth congestion before vessels
  arrive and to receive an optimised, explainable 72-hour operations plan that they
  can review and approve without relying on intuition or error-prone spreadsheets.

  '
solution_overview: PortFlow AI accepts vessel schedules and resource availability,
  provides baseline and trained scikit-learn predictions, and runs Google OR-Tools
  CP-SAT for berth-and-crane assignments. Supervisors inspect waiting-time comparisons,
  advisory routing, explanations, and an ephemeral approval acknowledgement. Copilot
  uses a local rules fallback unless an optional Watsonx deployment is configured.
