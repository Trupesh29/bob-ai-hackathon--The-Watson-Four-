project_name: "PortFlow AI - Container Congestion Predictor & Port Operations Optimiser"

track: "AI"

problem_statement: >
  L1 — Container Congestion Predictor & Port Operations Optimiser.
  Port shift supervisors lack the tools to anticipate berth congestion before
  vessels arrive and to receive an optimised, explainable 72-hour operations
  plan that they can review and approve without relying on intuition or
  error-prone spreadsheets.

solution_overview: >
  PortFlow AI ingests vessel schedules and berth-capacity data, uses a trained
  scikit-learn regression model to predict vessel waiting times and congestion
  risk scores, then feeds those predictions into a Google OR-Tools CP-SAT
  solver to produce jointly optimised berth and crane assignments.  IBM Bob
  serves as the development IDE and, through a read-only MCP server, explains
  model outputs and plan summaries in plain language.  The shift supervisor
  reviews an AI-generated 72-hour plan and must explicitly approve any routing
  or plan change — no LLM is permitted to calculate assignments or approve
  consequential actions.

