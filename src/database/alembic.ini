# Alembic configuration for PortFlow AI
#
# Run from src/ directory:
#   python -m alembic -c database/alembic.ini upgrade head
#   python -m alembic -c database/alembic.ini downgrade -1
#   python -m alembic -c database/alembic.ini revision --autogenerate -m "description"
#
# DATABASE_URL is read from the DATABASE_URL environment variable (or .env).
# It is never stored in this file.

[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# Do not put DATABASE_URL here. It is injected from environment in env.py.
sqlalchemy.url = placeholder_overridden_in_env_py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
